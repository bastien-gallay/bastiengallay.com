    <circle cx="120" cy="556" r="65" fill="none" stroke="#5d3c20" stroke-width="2" opacity="0.7"/></g>

  <text x="60" y="90" class="mono" font-size="20" font-weight="700" fill="#ff2e74" letter-spacing="3">PRESQUE-ÉTUDE N°1</text>
  <line x1="60" y1="102" x2="430" y2="102" stroke="#ff2e74" stroke-width="1" opacity="0.5"/>

