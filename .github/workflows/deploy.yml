name: Build & deploy site (Zola → GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Filets de sécurité rapides (numérotation §XX.YY, anti-token-Tera dans
      # les figures, markdownlint). Source unique : .pre-commit-config.yaml —
      # on lance ICI exactement les mêmes hooks qu'en local, donc rien ne peut
      # diverger entre le commit du dev et le déploiement.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run pre-commit hooks
        # `uv` est requis par le hook `check-numeros` (entry: `uv run …`,
        # script PEP 723). Il n'est pas préinstallé sur le runner — sans lui
        # le hook échoue (`Executable uv not found`) et casse le déploiement.
        run: |
          python3 -m pip install --quiet pre-commit uv
          pre-commit run --all-files --show-diff-on-failure

      - name: Install Zola
        run: |
          curl -sSL \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          zola --version

      # Filet de sécurité : `zola check` détecte les liens internes morts
      # (ancres, liens relatifs entre pages). Régression récurrente sur les
      # notes d'articles — cf. commits « fix(ecrits): liens morts des notes ».
      # `--skip-external-links` : ne pas rendre le déploiement dépendant de la
      # disponibilité de sites tiers (faux négatifs réseau).
      - name: Check internal links
        run: zola check --skip-external-links

      - name: Build
        run: zola build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
