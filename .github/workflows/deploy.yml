name: Build & deploy site (Zola → GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Filet de sécurité : tout article publié doit avoir [extra] numero
      # au format §XX.YY (cf. brainstorm 2026-05-24 + scripts/check-numeros.py).
      # Le hook pre-commit fait la même chose en local — ici on garantit que
      # rien ne déploie sans validation, même si un dev oublie pre-commit.
      - name: Set up Python (for check-numeros)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check article §XX.YY numbering
        run: python3 scripts/check-numeros.py

      - name: Install Zola
        run: |
          curl -sSL \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          zola --version

      - name: Build
        run: zola build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
